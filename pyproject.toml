[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus86-draw"
version = "0.9.2b2"
description = "Proteus 8.6 shared core with Codex and DeepSeek Harness adapters"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
capture = ["Pillow>=11.2.1"]

[project.scripts]
proteus86 = "proteus86.__main__:main"
proteus86-mcp = "proteus86.bridge:main"

[tool.setuptools]
packages = ["proteus86", "proteus86._codec", "proteus86_support", "proteus86_support.examples", "proteus86_support.scripts"]
license-files = ["LICENSE", "THIRD_PARTY.md"]

[tool.setuptools.package-dir]
proteus86_support = "packaging_support"
"proteus86_support.examples" = "examples"
"proteus86_support.scripts" = "scripts"

[tool.setuptools.package-data]
"proteus86" = ["examples/*.json", "examples/*.txt"]
"proteus86._codec" = ["LICENSE", "upstream-sha256.json"]
"proteus86_support.examples" = ["matrix_display.a51", "matrix_display.hex"]
