# Shared Codex/DSH bridge. Run from the chosen project workspace.
# Set DSH_PROTEUS_CHECKOUT when the tool checkout is elsewhere.
# Native calls appear only when DSH_PROTEUS_NATIVE_ROOT names a dedicated ASCII directory.
- insert:
    - id: mcp-proteus86
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: proteus86
        transport: stdio
        command: !!js process.env.DSH_PROTEUS_PYTHON ?? 'python'
        args: !!js "[ (process.env.DSH_PROTEUS_CHECKOUT ?? process.cwd()) + '/scripts/dsh_mcp.py', '--workspace', process.cwd(), '--output-root', process.env.DSH_PROTEUS_OUTPUT_ROOT ?? process.cwd() + '/output/proteus86', ...(process.env.DSH_PROTEUS_NATIVE_ROOT ? ['--native-root', process.env.DSH_PROTEUS_NATIVE_ROOT, '--allow-native'] : []) ]"
        cwd: !!js process.env.DSH_PROTEUS_CHECKOUT ?? process.cwd()
        env: !!js "Object.fromEntries(Object.entries({ PYTHONDONTWRITEBYTECODE: '1', PROTEUS86_TEMPLATE: process.env.PROTEUS86_TEMPLATE, PROTEUS86_HOME: process.env.PROTEUS86_HOME, TEMP: process.env.TEMP, TMP: process.env.TMP }).filter(([, value]) => value !== undefined))"
        toolCallTimeoutMs: 300000
        failOnStartupError: true
